
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Font Studio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --primary: #7c3aed;
    --secondary: #ec4899;
    --dark: #17152d;
    --muted: #77758c;
    --glass: rgba(255,255,255,.85);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at 10% 10%, #fce7f3, transparent 30%),
        radial-gradient(circle at 90% 10%, #ddd6fe, transparent 35%),
        linear-gradient(135deg, #f8f7ff, #eef2ff);
    color: var(--dark);
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 18px 60px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 40px 10px 30px;
}

.logo {
    display: inline-block;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    color: white;
    padding: 10px 18px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 8px 20px #a855f733;
}

.header h1 {
    font-size: clamp(32px, 6vw, 60px);
    font-weight: 800;
    margin: 20px 0 12px;
    letter-spacing: -2px;
}

.gradient-text {
    background: linear-gradient(90deg, #7c3aed, #ec4899, #f59e0b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.header p {
    color: var(--muted);
    max-width: 600px;
    margin: auto;
    line-height: 1.7;
}

/* INPUT PANEL */

.input-panel {
    background: var(--glass);
    border: 1px solid #ffffff;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 20px 50px #7c3aed12;
    backdrop-filter: blur(15px);
}

.input-panel label {
    font-size: 15px;
    font-weight: 700;
    display: block;
    margin-bottom: 12px;
}

textarea {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    padding: 20px;
    border: 2px solid #e9e5ff;
    border-radius: 16px;
    background: #faf9ff;
    outline: none;
    font-size: 17px;
    font-family: inherit;
    transition: .3s;
    color: var(--dark);
}

textarea:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 5px #8b5cf620;
    background: white;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
}

.btn {
    padding: 14px 22px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: transform .2s, box-shadow .2s, background .2s;
    font-family: inherit;
}

.btn:hover {
    transform: translateY(-3px);
}

.btn:active {
    transform: scale(.95);
}

.generate-btn {
    color: white;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    box-shadow: 0 8px 20px #a855f744;
}

.generate-btn:hover {
    box-shadow: 0 12px 28px #a855f766;
}

.clear-btn {
    color: #7c3aed;
    background: #ede9fe;
}

.clear-btn:hover {
    background: #ddd6fe;
}

.note {
    color: var(--muted);
    font-size: 13px;
    margin-top: 14px;
}

/* RESULTS */

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 35px 5px 20px;
}

.section-heading h2 {
    margin: 0;
    font-size: 24px;
}

.count-badge {
    padding: 8px 14px;
    border-radius: 50px;
    background: #ede9fe;
    color: #7c3aed;
    font-size: 13px;
    font-weight: 700;
}

.search-box {
    width: 100%;
    max-width: 320px;
    padding: 12px 15px;
    border: 1px solid #e4defe;
    border-radius: 12px;
    outline: none;
    background: white;
    font-size: 14px;
}

.search-box:focus {
    border-color: #8b5cf6;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
}

.card {
    background: rgba(255,255,255,.92);
    border: 1px solid #ffffff;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 18px #312e8110;
    transition: transform .25s, box-shadow .25s, border .25s;
    animation: appear .45s ease both;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px #7c3aed18;
    border-color: #ddd6fe;
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.style-name {
    color: #77758c;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .7px;
}

.result {
    font-size: 19px;
    line-height: 1.7;
    min-height: 45px;
    overflow-wrap: anywhere;
    color: #24213c;
    margin-bottom: 12px;
}

.copy-btn {
    background: #f3e8ff;
    color: #7c3aed;
    border: none;
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
    transition: .2s;
}

.copy-btn:hover {
    background: #7c3aed;
    color: white;
    transform: scale(1.05);
}

.copy-btn.copied {
    background: #dcfce7;
    color: #15803d;
}

.empty {
    color: #aaa;
    text-align: center;
    padding: 30px;
    grid-column: 1/-1;
}

.footer {
    text-align: center;
    color: #77758c;
    font-size: 13px;
    margin-top: 45px;
}

/* ANIMATIONS */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes confettiFall {
    0% {
        transform: translate3d(0,0,0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translate3d(var(--dx),var(--dy),0)
                   rotate(var(--rot));
        opacity: 0;
    }
}

@media(max-width:600px) {
    .container {
        padding: 15px 12px 40px;
    }

    .header {
        padding: 25px 5px;
    }

    .header h1 {
        letter-spacing: -1px;
    }

    .input-panel {
        padding: 20px;
    }

    .section-heading {
        flex-direction: column;
        align-items: flex-start;
    }

    .search-box {
        max-width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

    <div class="logo">✨ FONT STUDIO</div>

    <h1>
        Make Your Text
        <span class="gradient-text">Fancy!</span>
    </h1>

    <p>
        Transform ordinary text into 100 creative font styles.
        Copy, share and make your text stand out everywhere.
    </p>

</header>

<section class="input-panel">

    <label for="userText">✍️ Type your text here</label>

    <textarea id="userText"
        placeholder="Type your name, bio, caption or anything...">Hello World</textarea>

    <div class="button-row">

        <button class="btn generate-btn" id="generateBtn">
            ✨ Generate Styles
        </button>

        <button class="btn clear-btn" id="clearBtn">
            🗑️ Clear Text
        </button>

    </div>

    <div class="note">
        🎉 Click Generate to create your styles and celebrate with confetti!
    </div>

</section>

<div class="section-heading">

    <h2>🎨 Your Font Collection</h2>

    <div class="count-badge" id="countBadge">
        100 Styles
    </div>

    <input class="search-box" id="searchBox"
        placeholder="🔎 Search font styles...">

</div>

<div class="grid" id="fontResults"></div>

<footer class="footer">
    Made with 💜 for creative text lovers
</footer>

</div>

<script>

// ====================================
// FONT CONVERSION FUNCTIONS
// ====================================

function alphabet(upper, lower) {
    return text => [...text].map(char => {
        let n = char.codePointAt(0);

        if (n >= 65 && n <= 90)
            return String.fromCodePoint(upper + n - 65);

        if (n >= 97 && n <= 122)
            return String.fromCodePoint(lower + n - 97);

        return char;
    }).join("");
}

const bold = alphabet(0x1D400,0x1D41A);
const italic = alphabet(0x1D434,0x1D44E);
const boldItalic = alphabet(0x1D468,0x1D482);
const sans = alphabet(0x1D5A0,0x1D5BA);
const sansBold = alphabet(0x1D5D4,0x1D5EE);
const sansItalic = alphabet(0x1D608,0x1D622);
const sansBoldItalic = alphabet(0x1D63C,0x1D656);
const mono = alphabet(0x1D670,0x1D68A);
const doubleStruck = alphabet(0x1D538,0x1D552);
const fraktur = alphabet(0x1D504,0x1D51E);

const smallCaps = s => s.toLowerCase().replace(/[a-z]/g,c =>
    "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"[c.charCodeAt(0)-97] || c
);

const circled = s => s.replace(/[A-Za-z]/g,c =>
    String.fromCodePoint(0x24B6+c.toUpperCase().charCodeAt(0)-65)
);

const fullwidth = s => s.replace(/[!-~]/g,c =>
    String.fromCharCode(c.charCodeAt(0)+0xFEE0)
);

const upside = s => [...s].reverse().map(c => ({
    a:"ɐ",b:"q",c:"ɔ",d:"p",e:"ǝ",f:"ɟ",
    g:"ƃ",h:"ɥ",i:"ᴉ",j:"ɾ",k:"ʞ",l:"ן",
    m:"ɯ",n:"u",o:"o",p:"d",q:"b",r:"ɹ",
    s:"s",t:"ʇ",u:"n",v:"ʌ",w:"ʍ",x:"x",
    y:"ʎ",z:"z","!":"¡","?":"¿"
}[c.toLowerCase()]||c)).join("");

// ====================================
// FONT STYLE COLLECTION
// ====================================

let styles = [
["Bold",bold],
["Italic",italic],
["Bold Italic",boldItalic],
["Sans Serif",sans],
["Sans Bold",sansBold],
["Sans Italic",sansItalic],
["Sans Bold Italic",sansBoldItalic],
["Monospace",mono],
["Double Struck",doubleStruck],
["Fraktur",fraktur],
["Small Caps",smallCaps],
["Circled",circled],
["Fullwidth",fullwidth],
["Upside Down",upside]
];

// Decorative frames

const decorations = [
["Hearts","♥","♥"],
["Stars","★","★"],
["Sparkles","✧","✧"],
["Flowers","❀","❀"],
["Diamonds","◇","◇"],
["Music Notes","♫","♫"],
["Clouds","☁","☁"],
["Crowns","♛","♛"],
["Arrows","➳","➳"],
["Brackets","【","】"],
["Parentheses","（","）"],
["Square Brackets","［","］"],
["Curly Braces","｛","｝"],
["Stars Frame","✦","✦"],
["Glitter","⋆","⋆"],
["Cute Face","૮","ა"],
["Wave Frame","〜","〜"],
["Sunshine","☀","☀"],
["Leaf Frame","❧","❧"],
["Flower Frame","✿","✿"],
["Love Frame","ღ","ღ"],
["Royal","♕","♕"],
["Crosses","†","†"],
["Circle Frame","◉","◉"],
["Triangle Frame","△","△"],
["Dashes","—","—"],
["Dots","•","•"],
["Tildes","~","~"],
["Exclamation","¡","!"],
["Question","¿","?"],
["Lightning","ϟ","ϟ"],
["Fire","♨","♨"],
["Butterflies","ʚ","ɞ"],
["Angel","୨","୧"],
["Aesthetic","༺","༻"],
["Ornate","꧁","꧂"],
["Vintage","༄","༄"],
["Decorative","۞","۞"],
["Wings","ʚ","ɞ"],
["Ribbons","୨୧","୨୧"],
["Corner Stars","⋆｡","｡⋆"],
["Double Hearts","♡♡","♡♡"],
["Triple Stars","★★★","★★★"],
["Moon","☾","☽"],
["Planet","⪩","⪨"],
["Gem","♢","♢"],
["Sparkle Hearts","♡✧","✧♡"],
["Checkered","▧","▧"],
["Shiny","✩","✩"],
["Peace","☮","☮"],
["Music Frame","♪","♪"],
["Note Frame","♫","♫"],
["Snowflakes","❄","❄"],
["Rainbows","虹","虹"],
["Cherry","ღ","ღ"],
["Japanese Style","「","」"],
["Double Angle","《","》"],
["Angle","〈","〉"],
["Decorative Dots","ꔛ","ꔛ"],
["Swirls","༒","༒"],
["Scallop","꒰","꒱"],
["Soft Frame","〔","〕"],
["Bold Frame","〖","〗"],
["White Stars","☆","☆"],
["Black Hearts","♥","♥"],
["Tiny Stars","﹡","﹡"],
["Flower Petals","❁","❁"],
["Tulips","⚘","⚘"],
["Hearts and Stars","♥✦","✦♥"],
["Moon and Stars","☾⋆","⋆☽"],
["Crown and Stars","♛✧","✧♛"],
["Diamond Stars","◇✦","✦◇"],
["Fancy Quotes","❝","❞"],
["Wreath","❃","❃"],
["Final Flourish","༺ღ","ღ༻"]
];

decorations.forEach(([name,left,right]) => {
    styles.push([
        name,
        text => left + text + right
    ]);
});

// Extra text effects

styles.push(
["Strike Through",s=>[...s].map(c=>c+"\u0336").join("")],
["Underline",s=>[...s].map(c=>c+"\u0332").join("")],
["Double Underline",s=>[...s].map(c=>c+"\u0333").join("")],
["Overline",s=>[...s].map(c=>c+"\u0305").join("")],
["Dotted",s=>[...s].map(c=>c+"\u0307").join("")],
["Spaced",s=>[...s].join(" ")],
["Wide Spaced",s=>[...s].join("　")],
["Wavy Underline",s=>[...s].map(c=>c+"\u0342").join("")],
["Tiny Style",smallCaps],
["Decorated Caps",s=>s.toUpperCase().split("").join(" ")]
);

// Guarantee a total of 100 styles

styles = styles.slice(0,100);

// ====================================
// CONFETTI EFFECT
// ====================================

function confetti(amount=180) {

    const colors = [
        "#7c3aed","#ec4899","#f59e0b",
        "#22c55e","#06b6d4","#ef4444",
        "#6366f1","#f472b6","#a855f7"
    ];

    for(let i=0;i<amount;i++) {

        const particle = document.createElement("div");

        particle.style.position = "fixed";
        particle.style.left = Math.random()*100+"vw";
        particle.style.top = "-20px";
        particle.style.width = (5+Math.random()*9)+"px";
        particle.style.height = (5+Math.random()*9)+"px";
        particle.style.background =
            colors[Math.floor(Math.random()*colors.length)];

        particle.style.borderRadius =
            Math.random() > .5 ? "50%" : "2px";

        particle.style.zIndex = "99999";
        particle.style.pointerEvents = "none";

        particle.style.setProperty("--dx",
            (Math.random()*500-250)+"px");

        particle.style.setProperty("--dy",
            (500+Math.random()*700)+"px");

        particle.style.setProperty("--rot",
            (Math.random()*1000-500)+"deg");

        particle.style.animation =
            `confettiFall ${1.5+Math.random()*2.5}s ease-out forwards`;

        document.body.appendChild(particle);

        setTimeout(()=>particle.remove(),4500);
    }
}

// ====================================
// GENERATE FONT CARDS
// ====================================

const input = document.getElementById("userText");
const results = document.getElementById("fontResults");
const search = document.getElementById("searchBox");

function generateFonts() {

    const text = input.value;
    results.innerHTML = "";

    // Celebration on generation
    confetti(220);

    styles.forEach(([name,converter],index) => {

        const styledText = text
            ? converter(text)
            : "Your styled text appears here";

        const card = document.createElement("div");
        card.className = "card";

        card.style.animationDelay =
            Math.min(index*0.015,0.5)+"s";

        const top = document.createElement("div");
        top.className = "card-top";

        const title = document.createElement("div");
        title.className = "style-name";
        title.textContent = (index+1)+" · "+name;

        const copyButton = document.createElement("button");
        copyButton.className = "copy-btn";
        copyButton.textContent = "📋 Copy";

        copyButton.onclick = async function() {

            if(!text) {
                input.focus();
                return;
            }

            try {

                await navigator.clipboard.writeText(styledText);

                copyButton.textContent = "✓ Copied!";
                copyButton.classList.add("copied");

                // Small celebration when copying
                confetti(45);

                setTimeout(()=>{
                    copyButton.textContent = "📋 Copy";
                    copyButton.classList.remove("copied");
                },1800);

            } catch(error) {

                // Fallback for clipboard access
                const temp = document.createElement("textarea");
                temp.value = styledText;
                document.body.appendChild(temp);
                temp.select();

                try {
                    document.execCommand("copy");
                    copyButton.textContent = "✓ Copied!";
                } catch(e) {
                    copyButton.textContent = "Copy failed";
                }

                temp.remove();

                setTimeout(()=>{
                    copyButton.textContent = "📋 Copy";
                },1800);
            }
        };

        const output = document.createElement("div");
        output.className = "result";
        output.textContent = styledText;

        top.appendChild(title);
        top.appendChild(copyButton);

        card.appendChild(top);
        card.appendChild(output);

        results.appendChild(card);

    });

    document.getElementById("countBadge").textContent =
        styles.length+" Styles";
}

// ====================================
// SEARCH STYLES
// ====================================

search.addEventListener("input",function() {

    const query = this.value.toLowerCase();

    document.querySelectorAll(".card").forEach(card => {

        const name = card.querySelector(".style-name")
            .textContent.toLowerCase();

        card.style.display =
            name.includes(query) ? "" : "none";
    });

});

// ====================================
// BUTTONS
// ====================================

document.getElementById("generateBtn")
    .addEventListener("click",generateFonts);

document.getElementById("clearBtn")
    .addEventListener("click",function() {

        input.value = "";
        search.value = "";

        generateFonts();

        input.focus();
    });

// Initial render

generateFonts();

</script>
</body>
</html>
